# Линия метеоров (D67): почасовой коэффициент усиления NASA MEO для частиц, пробивающих скафандр.
# Коэффициент это отношение потока метеорных потоков к спорадическому фону на площадку, обращённую к радианту,
# из файла flux_data.txt годового прогноза MEO для низкой орбиты (NTRS). Прогноз с файлом данных есть на 2024,
# 2025 и 2026 годы (реестр в sources/meteor_docs.py); на другие годы линия отвечает «нет данных».
# Энергия 6.7 Дж (0.04 см при 20 км/с и 1 г/см³): по тексту прогноза MEO 2026 это частицы, способные пробить
# скафандр ВКД; остальные столбцы файла (0.1, 0.3 и 1 см) относятся к конструкции и гермокорпусу.
suit_energy_joule = 6.7
# Экран Земля плюс атмосфера 100 км (D29).
shield_radius_km = 6471.0
# Пороги уровней по коэффициенту для 6.7 Дж: наше правило (D67, D55). elevated при потоке потоков не меньше 20 %
# спорадического фона; high зарезервирован за вспышкой активности, когда поток потоков в пять раз выше фона.
elevated_factor = 0.2
high_factor = 5.0
# Список потоков ниже нужен только для экранирования Землёй: какие потоки активны в момент t и где их радианты.
# Периоды активности даны на 2024 год и переносятся на другие годы по долготе Солнца. Радианты есть только у
# шести потоков Table 2 прогноза MEO; поток без радианта считается видимым (экранирование не учитывается).
activity_calendar_year = 2024

