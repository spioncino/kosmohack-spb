[sources]
meo = "NASA MEO, годовые прогнозы метеорных потоков для низкой орбиты, файлы flux_data.txt записей NTRS 20230015158 (2024, распространение 2023-11-02), 20240012381 (2025, 2024-10-18), 20250009524 (2026, 2025-10-17): почасовые потоки и коэффициенты усиления относительно спорадического фона для 6.7 Дж, 105 Дж, 2.83 кДж, 105 кДж"
suit_energy = "NASA MEO, The 2026 meteor shower activity forecast for low Earth orbit (NTRS 20250009524), с. 1: 6.7-J (0.04-cm-equivalent) meteoroids, «This energy corresponds to that capable of penetrating an EVA suit»; алгоритм прогноза тот же, что в 2024 году (с. 1, раздел 2)"
radiants = "MEO 2024, Table 2 с. 3: радианты и скорости шести потоков с высоким потоком; периоды активности: IMO Meteor Shower Calendar 2027, Table 5 и 7, и IAU Meteor Data Center"
imo = "IMO Meteor Shower Calendar 2027, IMO INFO(3-26), https://www.imo.net/ShCal27s.pdf: Table 5 (рабочий список визуальных потоков) и Table 7 (дневные радиопотоки); даты рабочего списка привязаны к солнечной долготе и между годами сдвигаются не больше суток"
iau_mdc = "IAU Meteor Data Center, список установленных потоков, https://www.ta3.sk/IAUC22DB/MDC2022/Roje/roje_lista.php?corobic_roje=1&sort_roje=0: солнечная долгота начала и конца активности (Sl_b, Sl_e) по отдельным работам"
shield = "D29: экран Земля плюс атмосфера 100 км, угловой радиус около 73° на высоте 400 км"
thresholds = "пороги 0.2 и 5.0 по коэффициенту MEO для 6.7 Дж: наше правило (D55, D67); по прогнозам 2024–2026 годов коэффициент не выше 1.58 (Геминиды 2025 и 2026 годов, 0.58 в 2024), high не достигается"
solar_longitude = "перенос периодов активности на другой год по долготе Солнца: USNO Approximate Solar Coordinates (orbit/sun.py)"
