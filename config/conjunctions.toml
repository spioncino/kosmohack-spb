# Линия сближений: ограничение планирования в текущем режиме (D30, D53). Источник: CelesTrak SOCRATES, отчёт по МКС
# (запись socrates/conjunctions_iss); архива SOCRATES нет, в replay линия непригодна.
# Наше правило: запас времени вокруг TCA на решение об уклонении; интервал [TCA − margin, TCA + margin].
margin_minutes = 30.0
# Порог поиска SOCRATES: в отчёт попадают сближения не дальше 5 км (строка Computation Threshold). В уровень не
# входит: все строки отчёта ближе этого порога по построению.
close_range_km = 5.0
# Со-орбитальные объекты: пристыкованные и сближающиеся корабли идут рядом со станцией с относительной скоростью
# метры в секунду и попадают в отчёт на каждом витке (в отчёте 2026-09-18 это 55 строк SOYUZ-MS 29 из 60 при
# скорости до 0.006 км/с); объекты на пересекающихся орбитах имеют километры в секунду (2.7–15.3 км/с там же).
coorbiting_rel_speed_kms = 0.1
# Пороги вероятности столкновения правил полёта МКС: жёлтый 1 на 100 000, красный 1 на 10 000.
yellow_probability = 1e-5
red_probability = 1e-4
# Пороги переписаны по памяти публикации NASA и ждут сверки человеком, как коэффициент Leske в sep_line.toml.
thresholds_verified = false
# Наше правило: отчёт SOCRATES старше суток в текущем режиме считается устаревшим, линия stale без уровня.
max_report_age_hours = 24.0

[sources]
socrates = "CelesTrak SOCRATES, https://celestrak.org/SOCRATES/ (T.S. Kelso), таблица по NAME=ISS (ZARYA): TCA, MIN RANGE, REL SPEED, MAX PROB, DILUTION; порог 5 км из строки Computation Threshold отчёта"
margin = "наше правило (D30): 30 мин на решение об уклонении и завершение работ; в литературе числа нет"
maxprob = "D53: MAXPROB это максимум вероятности по дилюции ковариации при допущениях SOCRATES о форме ковариации и размере объектов, по публичным элементам; CelesTrak называет его консервативной оценкой. При вытянутых реальных ковариациях Pc может быть выше, поэтому MAXPROB ниже порога не гарантия; выше порога значит только, что порог не исключён"
thresholds = "NASA, Space Debris and Human Spacecraft (nasa.gov, раздел об уклонении МКС): манёвр рассматривается при вероятности столкновения выше 1 на 100 000 и выполняется при вероятности выше 1 на 10 000, если не добавляет риска экипажу"
report_age = "наше правило: отчёт старше 24 ч не выдаётся за текущий; линия stale, окна исключаются, а не считаются свободными от сближений"
coorbiting = "наше правило (D53) по распределению относительных скоростей в отчёте SOCRATES 2026-09-18"
