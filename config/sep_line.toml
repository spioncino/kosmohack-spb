# Пороги шкалы S: NOAA Space Weather Scales, интегральный поток протонов >=10 MeV, pfu.
s1_pfu = 10.0
s2_pfu = 100.0
s3_pfu = 1000.0
s4_pfu = 10000.0
s5_pfu = 100000.0
# Энергия протонов, проникающих через все части скафандра: пробег >= 4 мм Al (Leske et al. 2001, JGR 106, с. 30019, со ссылкой на Siscoe et al. 2000).
suit_threshold_mev = 30.0
# Наше правило: поток >=30 MeV не ниже 1 pfu при доступе даёт высокий уровень (по аналогии с порогом ESPE 1 pfu, SRAG AES-CHP-SW-002, с. 9–10).
p30_event_pfu = 1.0
# ESPE: поток >=100 MeV не ниже 1 pfu (SRAG AES-CHP-SW-002, с. 9–10; NRC 2000, гл. 2). При доступе даёт критический уровень.
p100_event_pfu = 1.0
# Спокойная вертикальная жёсткость обрезания по фиту измерений SAMPEX: R = C·cos^4(Λ) − R0 ГВ, C = 15.062 ГВ, R0 = 0.363 ГВ
# (Ogliore et al. 2001, ICRC 27, 4112; фит годен для Λ до 64°). Для 30 MeV это 63.4° (D62). Дипольное приближение Штёрмера
# с C = 14.5 ГВ без смещения давало 69.0°: на 5° выше измеренных 63.4° (Ogliore), 64.2° (Leske 2001), 63.6° (Birch 2005).
cutoff_constant_gv = 15.062
cutoff_offset_gv = 0.363
proton_rest_energy_mev = 938.272
# Снижение широты обрезания по Dst: 1/19.11 градуса на нТл (Leske et al. 2001, с. 30015, первоисточник).
dst_suppression_deg_per_nt = 0.05233
# Снижение по Kp: оценка по рис. 6 Leske et al. 2001 (около 64° при Kp≈1 и 58° при Kp≈7–8), линия фита в статье не напечатана.
kp_suppression_deg_per_kp = 0.92
kp_suppression_verified = false
# Kp, по которому считается доступ, когда ни наблюдённого, ни прогнозного Kp нет: верхняя граница шкалы.
kp_assumed_when_missing = 9.0
# Наше правило (D39): после отсечения поток протонов принимается постоянным (персистентность) не дальше 6 ч от последнего
# наблюдённого отсчёта; 6 ч это горизонт прогноза из ТЗ (R6). Дальше поток неизвестен, уровень только по внешнему прогнозу.
forecast_horizon_hours = 6.0
# Наше правило (D39): вероятность протонного события из daypre («Proton») или 3-day forecast («S1 or greater») не ниже 50 %
# поднимает уровень окружения после отсечения с none/unknown до elevated с пометкой external_forecast.
# За горизонтом персистентности (D42) вероятность задаёт уровень целиком: ниже порога none, не ниже elevated, kind external_forecast.
proton_outlook_threshold_percent = 50.0
# Наше правило (D60): событие по уведомлениям DONKI считается идущим столько часов после последнего подтверждающего
# сообщения, если более поздний измеренный поток не ниже порога события. DONKI почти не выпускает сообщений об окончании.
# Длительности вне тестового периода по GOES-18: ≥10 MeV 27.5 ч, не меньше 42.9 ч, 75.1 ч; ≥100 MeV 19.8 ч и 37.8 ч.
donki_p10_hold_hours = 48.0
donki_p100_hold_hours = 24.0
# Удержание события снимается, когда столько последних измеренных отсчётов позже подтверждения ниже порога события.
# Наше правило (D64) по аналогии с определением начала события по трём последовательным отсчётам GOES
# (SRAG AES-CHP-SW-002); правила окончания события в этом документе нет.
donki_end_samples = 3
# Событие с истёкшим сроком удержания и без измеренного окончания даёт уровень не ниже elevated не дольше стольких часов
# от последнего подтверждения; дальше событие не учитывается. Наибольшая измеренная длительность события ≥10 MeV 75.1 ч (D64).
donki_floor_hours = 96.0
# Фундамент прокси дозы (D34): минимальная защита мягких частей EMU 0.18 г/см² Al-экв. (Wilson et al., NTRS 20060046504, с. 13);
# коэффициенты флюенс -> эффективная доза ICRP 116, протоны, ISO (файл OpenMC icrp116/protons.txt).
suit_shielding_g_cm2 = 0.18
dose_coefficients = "ICRP 116 (2010), протоны, ISO; данные OpenMC openmc/data/dose/icrp116/protons.txt; 10 MeV 45.8, 50 MeV 451, 100 MeV 1130, 500 MeV 1180 pSv·cm²"

[sources]
s_scale = "https://www.swpc.noaa.gov/noaa-scales-explanation"
suit_threshold = "Leske R.A. et al. (2001) JGR 106(A12) 30011–30022, с. 30019; скан https://authors.library.caltech.edu/records/kas3p-vsx75/files/2003-28.pdf"
espe = "SRAG AES-CHP-SW-002 (2020) https://srag.jsc.nasa.gov/SRAGFiles/Publications/SRAG_Model_Requirements.pdf, с. 9–10, 15; NRC (2000) гл. 2"
cutoff_fit = "Ogliore R.C. et al. (2001) Proc. ICRC 27, 4112: фит Rc = 15.062·cos⁴Λ − 0.363 ГВ для Λ от 0° до 64° по измерениям SAMPEX; https://authors.library.caltech.edu/records/7vz0r-70n75. Сверка: Leske 2001 в записи Dmitriev et al. 2010 (JGR 115, A12244) λ = 64.2° + Dst/19.11; Birch et al. 2005 λ = 63.6° + Dst/35.7. Разброс точки отсчёта около 1° (D62)"
dst_suppression = "Leske et al. (2001), с. 30015: поправка Dst/19.11"
kp_suppression = "Leske et al. (2001), рис. 6, с. 30016: оценка по рисунку, требует сверки человеком"
kp_assumed_when_missing = "наше правило (D54): шкала Kp ограничена 9; при неизвестном Kp доступ оценивается по наибольшему снижению широты обрезания: отказ источника Kp не должен уменьшать число минут доступа"
forecast_horizon = "наше правило (D39); длительность 6 ч задана ТЗ как горизонт прогноза, R6 в docs/REQUIREMENTS.md"
donki_hold = "наше правило (D60): длительности событий 31 мая 2025, 9 октября 2024 и 10–13 ноября 2025 по потоку GOES-18 SGPS; в литературе единого срока нет, NOAA: радиационные бури длятся от часов до нескольких суток"
proton_outlook_threshold = "наше правило (D39, D42): 50 % это граница «скорее да, чем нет» для вероятности SWPC; источника в литературе нет"
shielding = "Wilson J.W. et al. Spacesuit Radiation Shield Design Methods, NTRS 20060046504, с. 2, 13"
dose = "ICRP Publication 116 (2010), Ann. ICRP 40(2–5); данные OpenMC"
p30_event = "наше правило по аналогии с порогом ESPE 1 pfu для ≥100 MeV (SRAG AES-CHP-SW-002): поток ≥30 MeV (энергия проникновения через все части скафандра, Leske 2001) не ниже 1 pfu при доступе даёт high"
donki_end = "наше правило (D64) по аналогии с определением начала события по трём последовательным отсчётам GOES в SRAG AES-CHP-SW-002; правила окончания события там нет"
donki_floor = "наше правило (D64): дольше наибольшей измеренной длительности события ≥10 MeV 75.1 ч по GOES-18 SGPS (события вне тестового периода)"
